<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Argust app icon</title>
  <desc id="desc">Rounded light app tile with the Argust abstract A symbol in a blue-to-violet gradient.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EDF8"/></linearGradient>
    <linearGradient id="argustGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CCBFF"/><stop offset="0.42" stop-color="#3978F6"/><stop offset="0.76" stop-color="#6547ED"/><stop offset="1" stop-color="#B58BFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="#172554" opacity=".10" filter="url(#shadow)"/>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#tile)"/>
  <g transform="translate(76 79)">
