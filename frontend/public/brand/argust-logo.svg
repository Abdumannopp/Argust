<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Argust — Intelligent Cyber Defense</title>
  <desc id="desc">Argust wordmark with a fluid abstract A symbol in a blue-to-violet gradient.</desc>
  <defs>
    <linearGradient id="argustGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CCBFF"/>
      <stop offset="0.42" stop-color="#3978F6"/>
      <stop offset="0.76" stop-color="#6547ED"/>
      <stop offset="1" stop-color="#B58BFF"/>
    </linearGradient>
    <linearGradient id="argustHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".28"/>
    </linearGradient>
  </defs>
  <g transform="translate(34 22)">
