    <path d="M93 171 C143 139 196 123 251 133" fill="none" stroke="url(#argustGradient)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 232 C95 164 143 78 174 42" fill="none" stroke="url(#argustHighlight)" stroke-width="10" stroke-linecap="round" opacity=".36"/>
  </g>
  <text x="430" y="178" fill="#111827" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="142" font-weight="620" letter-spacing="-6">Argust</text>
  <text x="438" y="238" fill="#747D90" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="6.4">INTELLIGENT CYBER DEFENSE</text>
</svg>
